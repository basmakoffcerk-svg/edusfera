services:
    db:
        image: 'postgres:16'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'edusfera-db:/var/lib/postgresql/data'
        networks:
            - edusfera

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'edusfera-redis:/data'
        networks:
            - edusfera

    mailhog:
        image: 'mailhog/mailhog:latest'
        ports:
            - '${FORWARD_MAILHOG_PORT:-1025}:1025'
            - '${FORWARD_MAILHOG_DASHBOARD_PORT:-8025}:8025'
        networks:
            - edusfera

    media:
        build:
            context: ./edusfera-media
            dockerfile: Dockerfile
        ports:
            - '${MEDIA_PORT:-8088}:8088'
        environment:
            PORT: '8088'
            JWT_SECRET: '${CLASSROOM_JWT_SECRET}'
            ALLOWED_ORIGINS: '${MEDIA_ALLOWED_ORIGINS:-https://edusfera.by,http://localhost:8000}'
            STUN_SERVERS: '${STUN_SERVER:-stun:stun.l.google.com:19302}'
            LOG_LEVEL: '${MEDIA_LOG_LEVEL:-info}'
            MAX_ROOM_SIZE: '${CLASSROOM_MAX_ROOM_SIZE:-5}'
            ROOM_IDLE_TIMEOUT_MINUTES: '120'
        restart: unless-stopped
        networks:
            - edusfera

    coturn:
        image: 'coturn/coturn:latest'
        ports:
            - '3478:3478'
            - '3478:3478/udp'
            - '5349:5349'
            - '5349:5349/udp'
            - '49152-49200:49152-49200/udp'
        environment:
            DETECT_EXTERNAL_IP: 'yes'
            DETECT_RELAY_IP: 'yes'
        volumes:
            - './coturn/turnserver.conf:/etc/turnserver.conf:ro'
        restart: unless-stopped
        networks:
            - edusfera

    ledger:
        build:
            context: ./edusfera-ledger
            dockerfile: Dockerfile
        ports:
            - '${LEDGER_PORT:-8082}:8080'
        environment:
            PORT: '8080'
            DB_HOST: host.docker.internal
            DB_PORT: '5432'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            DB_DATABASE: '${DB_DATABASE}'
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - db
        networks:
            - edusfera

    workspace:
        build:
            context: ./edusfera-workspace
            dockerfile: Dockerfile
        ports:
            - '${WORKSPACE_PORT:-8083}:8080'
        environment:
            PORT: '8080'
            DB_HOST: host.docker.internal
            DB_PORT: '5432'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            DB_DATABASE: '${DB_DATABASE}'
            REDIS_HOST: redis
            REDIS_PORT: '6379'
            INTERNAL_SECRET: '${WORKSPACE_INTERNAL_SECRET:-workspace_internal_secret_key}'
            JWT_SECRET: '${CLASSROOM_JWT_SECRET}'
            LOG_LEVEL: 'debug'
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - db
            - redis
        networks:
            - edusfera

    nginx:
        image: nginx:alpine
        container_name: edusfera-nginx-local
        ports:
            - '${GATEWAY_PORT:-8080}:80'
        volumes:
            - ./nginx/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - media
            - ledger
            - workspace
        networks:
            - edusfera

networks:
    edusfera:
        driver: bridge

volumes:
    edusfera-db:
        driver: local
    edusfera-redis:
        driver: local
