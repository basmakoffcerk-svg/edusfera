server {
    listen 80;
    server_name localhost;

    # Max upload size
    client_max_body_size 50M;

    # ── Микросервисы платформы (API Gateway Routing) ───────────────
    # Эндпоинт верификации токенов для auth_request
    location = /api/internal/v1/auth/verify {
        internal;
        proxy_pass http://host.docker.internal:8000/api/internal/v1/auth/verify$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;

        # Унификация токена: если Authorization пустой, подставляем ?token=...
        set $auth_token $http_authorization;
        if ($auth_token = "") {
            set $auth_token "Bearer $arg_token";
        }
        proxy_set_header Authorization $auth_token;
    }

    # Финансовый микросервис (Ledger)
    location /api/v1/ledger/ {
        # Стираем входящие заголовки от клиента во избежание спуфинга
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Classroom-Room-Id "";

        auth_request /api/internal/v1/auth/verify;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_user_role $upstream_http_x_user_role;

        rewrite ^/api/v1/ledger/(.*)$ /$1 break;
        proxy_pass http://ledger:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # Пробрасываем авторизованные метаданные
        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-User-Role $auth_user_role;
    }

    # Стриминговый микросервис (Media WebSocket)
    location /ws/ {
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Classroom-Room-Id "";

        auth_request /api/internal/v1/auth/verify;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_user_role $upstream_http_x_user_role;

        proxy_pass http://media:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        
        # Увеличение таймаутов для WebSocket соединений
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Пробрасываем авторизованные метаданные
        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-User-Role $auth_user_role;
    }

    # Стриминговый микросервис (Media REST, например health check)
    location /api/v1/media/ {
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Classroom-Room-Id "";

        auth_request /api/internal/v1/auth/verify;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_user_role $upstream_http_x_user_role;

        rewrite ^/api/v1/media/(.*)$ /$1 break;
        proxy_pass http://media:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # Пробрасываем авторизованные метаданные
        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-User-Role $auth_user_role;
    }

    # Виртуальный класс (Workspace WebSocket)
    location /ws/workspace/ {
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Classroom-Room-Id "";

        auth_request /api/internal/v1/auth/verify;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_user_role $upstream_http_x_user_role;
        auth_request_set $auth_classroom_room_id $upstream_http_x_classroom_room_id;

        proxy_pass http://workspace:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Пробрасываем авторизованные метаданные
        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-User-Role $auth_user_role;
        proxy_set_header X-Classroom-Room-Id $auth_classroom_room_id;
    }

    # Внутренний эндпоинт для ИИ-патчей от Laravel (без auth_request)
    location ~ ^/api/v1/workspace/([^/]+)/apply-ai-patch$ {
        proxy_pass http://workspace:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # Виртуальный класс (Workspace REST)
    location /api/v1/workspace/ {
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Classroom-Room-Id "";

        auth_request /api/internal/v1/auth/verify;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_user_role $upstream_http_x_user_role;
        auth_request_set $auth_classroom_room_id $upstream_http_x_classroom_room_id;

        proxy_pass http://workspace:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # Пробрасываем авторизованные метаданные
        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-User-Role $auth_user_role;
        proxy_set_header X-Classroom-Room-Id $auth_classroom_room_id;
    }
    # ───────────────────────────────────────────────────────────────

    # Маршрутизация на локальный Laravel (работает на хосте)
    location / {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }
}
