server {
    listen 80;
    server_name edusfera.by www.edusfera.by;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name edusfera.by www.edusfera.by;

    root /var/www/edusfera/public;
    index index.php;

    # SSL (Certbot)
    ssl_certificate /etc/letsencrypt/live/edusfera.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edusfera.by/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Max upload size (classroom files)
    client_max_body_size 50M;

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|woff|ttf|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Промо-лендинг (заглушка до запуска платформы) ──────────────
    # Корень домена отдаёт статичный лендинг из public/promo/.
    # Платформа (Laravel) при этом продолжает работать по своим
    # маршрутам: /tutors, /admin/*, /api/*, /offer и т.д.
    #
    # ПЕРЕКЛЮЧЕНИЕ НА ПЛАТФОРМУ:
    #   1) удалите три location-блока промо ниже (location = /, location = /promo, location /promo/)
    #   2) и корень edusfera.by снова начнёт отдавать Laravel (public/index.php).
    location = / { return 302 /promo/; }
    location = /promo { return 302 /promo/; }
    location ~* ^/promo/.+\.(css|js|woff2|woff|ttf|svg|png|jpg|jpeg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /promo/ {
        index index.html;
        try_files $uri $uri/ /promo/index.html?$query_string;
    }
    # ───────────────────────────────────────────────────────────────

    # ── Микросервисы платформы (API Gateway Routing) ───────────────
    # Финансовый микросервис (Ledger)
    location /api/v1/ledger/ {
        rewrite ^/api/v1/ledger/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # Стриминговый микросервис (Media WebSocket)
    location /ws/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        
        # Увеличение таймаутов для WebSocket соединений
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Стриминговый микросервис (Media REST, например health check)
    location /api/v1/media/ {
        rewrite ^/api/v1/media/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }
    # ───────────────────────────────────────────────────────────────

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM (bare-metal: local socket)
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Deny access to sensitive files
    location ~* \.(env|json|log|md)$ {
        deny all;
    }
}
