# ══════════════════════════════════════════════════════════════════════════════
# Nginx configuration for test.edusfera.by (Staging & WebPAY Audit)
# ══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name test.edusfera.by;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name test.edusfera.by;

    root /var/www/html/public;
    index index.php;

    # SSL (Certbot for test.edusfera.by)
    ssl_certificate /etc/letsencrypt/live/test.edusfera.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.edusfera.by/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' wss: https:;" always;

    # Max upload size (classroom files)
    client_max_body_size 50M;

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|woff|ttf|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Internal auth verification endpoint for FastCGI microservices
    location = /api/internal/v1/auth/verify {
        internal;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param REQUEST_URI /api/internal/v1/auth/verify;
        fastcgi_param QUERY_STRING "";
        fastcgi_pass_request_body off;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
        fastcgi_param HTTP_X_ORIGINAL_METHOD $request_method;

        set $auth_token $http_authorization;
        if ($auth_token = "") {
            set $auth_token "Bearer $arg_token";
        }
        fastcgi_param HTTP_AUTHORIZATION $auth_token;
    }

    # WebPAY Webhook endpoint (direct routing with IP allowlist check in controller)
    location /webhooks/webpay {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Microservices API Gateway Routing
    location /api/v1/ledger/ {
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Classroom-Room-Id "";

        auth_request /api/internal/v1/auth/verify;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_user_role $upstream_http_x_user_role;

        rewrite ^/api/v1/ledger/(.*)$ /$1 break;
        proxy_pass http://ledger:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-User-Role $auth_user_role;
    }

    # Media WebSocket
    location /ws/ {
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Classroom-Room-Id "";

        auth_request /api/internal/v1/auth/verify;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_user_role $upstream_http_x_user_role;

        proxy_pass http://media:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-User-Role $auth_user_role;
    }

    # Laravel Application Routing (Land directly on main platform for WebPAY auditors)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Deny access to sensitive files
    location ~* \.(env|json|log|md)$ {
        deny all;
    }
}
