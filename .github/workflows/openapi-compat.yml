name: OpenAPI Compatibility Check

# Запускается на pull request к main.
# Сравнивает docs/api/openapi.yaml из PR с версией из main ветки.
# Блокирует merge при обнаружении breaking changes (удаление поля, изменение типа).
on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/api/openapi.yaml"

permissions:
  contents: read
  pull-requests: write

jobs:
  openapi-compat:
    name: Check OpenAPI backward compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: pr

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Install oasdiff
        run: |
          # Скачиваем последний релиз oasdiff для linux/amd64
          OASDIFF_VERSION=$(curl -s https://api.github.com/repos/tufin/oasdiff/releases/latest \
            | grep '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -sSL "https://github.com/tufin/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin oasdiff
          oasdiff version

      - name: Check for breaking changes
        id: compat_check
        run: |
          set +e

          # Проверяем наличие файла в main (первый PR может добавлять файл)
          if [ ! -f main/docs/api/openapi.yaml ]; then
            echo "result=new_file" >> "$GITHUB_OUTPUT"
            echo "No openapi.yaml in main — treating as new file, skipping breaking change check."
            exit 0
          fi

          # Запускаем oasdiff breaking-changes
          BREAKING_OUTPUT=$(oasdiff breaking \
            main/docs/api/openapi.yaml \
            pr/docs/api/openapi.yaml \
            --format text 2>&1)
          BREAKING_EXIT=$?

          echo "breaking_output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BREAKING_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ $BREAKING_EXIT -ne 0 ] || [ -n "$BREAKING_OUTPUT" ]; then
            echo "result=breaking" >> "$GITHUB_OUTPUT"
          else
            echo "result=ok" >> "$GITHUB_OUTPUT"
          fi

          # Также собираем полный diff для информации
          DIFF_OUTPUT=$(oasdiff diff \
            main/docs/api/openapi.yaml \
            pr/docs/api/openapi.yaml \
            --format text 2>&1 || true)

          echo "diff_output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$DIFF_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Comment PR with compatibility result
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ steps.compat_check.outputs.result }}';
            const breakingOutput = `${{ steps.compat_check.outputs.breaking_output }}`;
            const diffOutput = `${{ steps.compat_check.outputs.diff_output }}`;

            let body;

            if (result === 'new_file') {
              body = [
                '## 📄 OpenAPI Compatibility Check',
                '',
                '✅ `docs/api/openapi.yaml` добавлен впервые — проверка breaking changes пропущена.',
              ].join('\n');
            } else if (result === 'breaking') {
              body = [
                '## ❌ OpenAPI Compatibility Check — Breaking Changes Detected',
                '',
                '**В рамках `v1` удаление полей и изменение типов запрещено.**',
                'Для breaking-изменений необходимо:',
                '1. Создать `/api/v2/*` с новым контрактом',
                '2. Добавить заголовок `Deprecation: true` в ответы `/api/v1/*`',
                '3. Поддерживать `v1` минимум **два цикла релиза**',
                '',
                '### Breaking changes:',
                '```',
                breakingOutput || '(нет вывода)',
                '```',
                '',
                diffOutput ? `<details><summary>Полный diff</summary>\n\n\`\`\`\n${diffOutput}\n\`\`\`\n</details>` : '',
              ].join('\n');
            } else {
              body = [
                '## ✅ OpenAPI Compatibility Check — No Breaking Changes',
                '',
                '`docs/api/openapi.yaml` обратно совместим с `main`.',
                '',
                diffOutput ? `<details><summary>Изменения в спецификации</summary>\n\n\`\`\`\n${diffOutput}\n\`\`\`\n</details>` : 'Изменений нет.',
              ].join('\n');
            }

            // Ищем существующий комментарий от бота и обновляем его
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('OpenAPI Compatibility Check')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on breaking changes
        if: steps.compat_check.outputs.result == 'breaking'
        run: |
          echo "::error::Breaking changes detected in docs/api/openapi.yaml."
          echo "In v1, fields can only be added, not removed or changed."
          echo "To make breaking changes: bump to /api/v2 + add Deprecation header to v1 for 2+ release cycles."
          exit 1
