# Coturn TURN Server Configuration for Edusfera.by
# https://github.com/coturn/coturn

# Listener port for TURN relay
listening-port=3478
tls-listening-port=5349

# Relay ports range
min-port=49152
max-port=49200

# Use fingerprints in TURN messages
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Realm
realm=edusfera.by

# TURN server credentials (change in production!)
user=edusfera:change-me-strong-password

# Total quota of per-session allocations
total-quota=100

# Max bytes-per-second bandwidth
bps-capacity=0

# Stale nonce lifetime
stale-nonce=600

# Log to stdout for Docker
log-file=stdout

# No CLI
no-cli

# Disable multicast peers
no-multicast-peers

# Only allow TURN relay for UDP and TCP
no-tlsv1
no-tlsv1_1
