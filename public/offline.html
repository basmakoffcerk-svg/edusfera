<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Edusfera — Офлайн режим</title>
    <meta name="theme-color" content="#0C0A14">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #0C0A14 0%, #151122 50%, #1F1B2E 100%);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .offline-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 48px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-wrap {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: #7D39EB;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(125, 57, 235, 0.4);
            position: relative;
        }
        .logo-wrap svg {
            width: 52px;
            height: 52px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 9999px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 9999px;
            background: #EF4444;
            box-shadow: 0 0 10px #EF4444;
            animation: pulse 2s infinite;
        }
        h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            color: #FFFFFF;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: #9CA3AF;
            margin-bottom: 28px;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 52px;
            border-radius: 16px;
            background: #7D39EB;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 20px rgba(125, 57, 235, 0.35);
        }
        .btn-retry:hover {
            background: #6D28D9;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(125, 57, 235, 0.45);
        }
        .btn-retry:active {
            transform: translateY(0);
        }
        .tip {
            margin-top: 20px;
            font-size: 12px;
            color: #6B7280;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="logo-wrap">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M32 10L54 32L32 54L10 32L32 10Z" stroke="#C6FF33" stroke-width="6" stroke-linejoin="round"/>
                <path d="M32 22L42 32L32 42L22 32L32 22Z" fill="#C6FF33"/>
            </svg>
        </div>

        <div class="status-badge" id="statusBadge">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Нет подключения к сети</span>
        </div>

        <h1>Вы находитесь офлайн</h1>
        <p>
            Для синхронизации расписания, занятий и связи с репетиторами требуется подключение к интернету. Проверьте Wi-Fi или мобильные данные.
        </p>

        <button type="button" class="btn-retry" onclick="retryConnection()" id="retryBtn">
            <span>Обновить страницу</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                <path d="M16 21h5v-5"/>
            </svg>
        </button>

        <div class="tip">
            При восстановлении связи приложение обновится автоматически
        </div>
    </div>

    <script>
        function updateStatus() {
            if (navigator.onLine) {
                const badge = document.getElementById('statusBadge');
                const dot = document.getElementById('statusDot');
                const text = document.getElementById('statusText');
                if (badge && dot && text) {
                    badge.style.background = 'rgba(16, 185, 129, 0.15)';
                    badge.style.borderColor = 'rgba(16, 185, 129, 0.3)';
                    badge.style.color = '#6EE7B7';
                    dot.style.background = '#10B981';
                    dot.style.boxShadow = '0 0 10px #10B981';
                    text.textContent = 'Связь восстановлена! Загрузка...';
                }
                setTimeout(() => {
                    window.location.reload();
                }, 800);
            }
        }

        function retryConnection() {
            const btn = document.getElementById('retryBtn');
            if (btn) {
                btn.style.opacity = '0.7';
                btn.innerHTML = '<span>Проверка соединения...</span>';
            }
            fetch('/favicon.svg?t=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
                .then(() => {
                    window.location.reload();
                })
                .catch(() => {
                    if (btn) {
                        btn.style.opacity = '1';
                        btn.innerHTML = '<span>Обновить страницу</span>';
                    }
                });
        }

        window.addEventListener('online', updateStatus);
        setInterval(() => {
            if (navigator.onLine) {
                updateStatus();
            }
        }, 3000);
    </script>
</body>
</html>
