# Production docker-compose — edusfera.by
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: edusfera-app
    container_name: edusfera-app
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edusfera

  nginx:
    image: nginx:alpine
    container_name: edusfera-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - edusfera

  queue:
    image: edusfera-app
    container_name: edusfera-queue
    restart: unless-stopped
    env_file: .env.production
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - edusfera

  scheduler:
    image: edusfera-app
    container_name: edusfera-scheduler
    restart: unless-stopped
    env_file: .env.production
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_started
    networks:
      - edusfera

  db:
    image: postgres:16-alpine
    container_name: edusfera-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - edusfera-db:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edusfera

  redis:
    image: redis:7-alpine
    container_name: edusfera-redis
    restart: unless-stopped
    volumes:
      - edusfera-redis:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edusfera

  media:
    build:
      context: ./edusfera-media
      dockerfile: Dockerfile
    container_name: edusfera-media
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      PORT: "8088"
      JWT_SECRET: "${CLASSROOM_JWT_SECRET}"
      ALLOWED_ORIGINS: "https://edusfera.by"
      STUN_SERVERS: "${STUN_SERVER:-stun:stun.l.google.com:19302}"
      LOG_LEVEL: "info"
      MAX_ROOM_SIZE: "${CLASSROOM_MAX_ROOM_SIZE:-5}"
      ROOM_IDLE_TIMEOUT_MINUTES: "120"
    networks:
      - edusfera

  coturn:
    image: coturn/coturn:4.6.2
    container_name: edusfera-coturn
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "49152-49200:49152-49200/udp"
    environment:
      DETECT_EXTERNAL_IP: "yes"
      DETECT_RELAY_IP: "yes"
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf:ro
    networks:
      - edusfera

  ledger:
    build:
      context: ./edusfera-ledger
      dockerfile: Dockerfile
    container_name: edusfera-ledger
    restart: unless-stopped
    env_file: .env.production
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_DATABASE: "${DB_DATABASE}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edusfera
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  workspace:
    build:
      context: ./edusfera-workspace
      dockerfile: Dockerfile
    container_name: edusfera-workspace
    restart: unless-stopped
    env_file: .env.production
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_DATABASE: "${DB_DATABASE}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      INTERNAL_SECRET: "${WORKSPACE_INTERNAL_SECRET}"
      JWT_SECRET: "${CLASSROOM_JWT_SECRET}"
      LOG_LEVEL: "info"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edusfera

  certbot:
    image: certbot/certbot
    container_name: edusfera-certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  edusfera:
    driver: bridge

volumes:
  edusfera-db:
    driver: local
  edusfera-redis:
    driver: local
  certbot-conf:
    driver: local
  certbot-www:
    driver: local
